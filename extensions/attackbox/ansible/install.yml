---
# Ansible playbook for attackbox provisioning
- name: "Provision Kali Linux attackbox"
  hosts: attackbox
  become: yes
  tasks:
    - name: "Enable SSH service"
      systemd:
        name: ssh
        enabled: yes
        state: started

    - name: "Configure SSH to allow password authentication"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
      notify: restart ssh

    - name: "Set kali user password"
      user:
        name: kali
        password: "{{ 'kali' | password_hash('sha512') }}"
        state: present

    - name: "Add kali user to sudo group"
      user:
        name: kali
        groups: sudo
        append: yes

    - name: Set zsh as default shell for kali user
      user:
        name: kali
        shell: /usr/bin/zsh
  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
