---
# Ansible playbook for attackbox provisioning
- name: "Provision Kali Linux attackbox"
  hosts: attackbox
  become: yes
  tasks:
    - name: "Enable SSH service"
      systemd:
        name: ssh
        enabled: yes
        state: started

    - name: "Configure SSH to allow password authentication"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
      notify: restart ssh

    - name: "Set kali user password"
      user:
        name: kali
        password: "{{ 'kali' | password_hash('sha512') }}"
        state: present

    - name: "Add kali user to sudo group"
      user:
        name: kali
        groups: sudo
        append: yes

    - name: Set zsh as default shell for kali user
      user:
        name: kali
        shell: /usr/bin/zsh

    - name: "Install nodejs, npm and Caldera prereqs"
      shell: |
        DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm git zlib1g tmux

    - name: "Install uv"
      become: true
      become_user: kali
      shell: |
        curl -LsSf https://astral.sh/uv/install.sh | DEBIAN_FRONTEND=noninteractive sh

    - name: "Check if Caldera directory exists"
      stat:
        path: /home/kali/caldera
      register: caldera_dir

    - name: "Download Caldera from git"
      become: true
      become_user: kali
      shell: |
        cd /home/kali && git clone --recursive --single-branch --branch 5.3.0 --depth 1 https://github.com/mitre/caldera.git
      when: not caldera_dir.stat.exists

    - name: "Change 'lxml~=4.9.0  # debrief' to 'lxml~=5.3.0  # debrief' in requirements.txt"
      become: true
      become_user: kali
      replace:
        path: /home/kali/caldera/requirements.txt
        regexp: 'lxml\~=4\.9\.0'
        replace: 'lxml~=5.3.0'

    - name: "Change 'lxml~=4.9.0  # debrief' to 'lxml~=5.3.0  # debrief' in plugins/stockpile/requirements.txt"
      become: true
      become_user: kali
      replace:
        path: /home/kali/caldera/plugins/stockpile/requirements.txt
        regexp: 'lxml\~=4\.9\.0'
        replace: 'lxml~=5.3.0'

    - name: "Install Caldera"
      become: true
      become_user: kali
      shell: |
        cd /home/kali/caldera && /home/kali/.local/bin/uv venv && /home/kali/.local/bin/uv pip install -r requirements.txt && /home/kali/.local/bin/uv pip install -r plugins/stockpile/requirements.txt

    - name: "Start Caldera in a tmux session"
      become: true
      become_user: kali
      shell: |
        cd /home/kali/caldera && tmux new-session -d -s caldera '/home/kali/.local/bin/uv run server.py --insecure --build --fresh'

  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
