---
# Ansible playbook for attackbox provisioning
- name: "Provision Kali Linux attackbox"
  hosts: attackbox
  become: yes
  tasks:
    - name: "Update package cache"
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "Upgrade all packages"
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: "Install additional penetration testing tools"
      apt:
        name:
          - nmap
          - python3-pip
          - git
          - curl
          - wget
          - vim
          - tmux
          - screen
          - net-tools
          - dnsutils
          - tcpdump
          - ldap-utils
        state: present

    - name: "Enable SSH service"
      systemd:
        name: ssh
        enabled: yes
        state: started

    - name: "Configure SSH to allow password authentication"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
      notify: restart ssh

    - name: "Set kali user password"
      user:
        name: kali
        password: "{{ 'kali' | password_hash('sha512') }}"
        state: present

    - name: "Add kali user to sudo group"
      user:
        name: kali
        groups: sudo
        append: yes

  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
