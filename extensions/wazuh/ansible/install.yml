- name: Install and configure Wazuh Manager
  hosts: wazuh_server
  become: yes
  roles:
    - { role: 'wazuh_manager', tags: 'wazuh_manager' }

- name: Preconfigure Wazuh Agent Machines
  hosts: wazuh_agents
  tasks:
    - name: Install windows defender
      win_feature:
        name: Windows-Defender
      register: win_defender_install

    - name: Reboot if needed
      win_reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
      when: win_defender_install.reboot_required

    - name: Enable windows defender sending sample
      win_shell: Set-MpPreference -MAPSReporting 1

    - name: Enable windows defender sending sample
      win_shell: Set-MpPreference -SubmitSamplesConsent 1

    - name: Enable network drive scanning
      win_shell: Set-MpPreference -DisableScanningMappedNetworkDrivesForFullScan $false

    - name: Enable realtime monitoring
      win_shell: Set-MpPreference -DisableRealtimeMonitoring $false
  roles:
    - { role: 'logs_windows', tags: 'agent' }

- name: Install Wazuh Agent
  hosts: wazuh_agents
  roles:
    - { role: 'wazuh_agent', tags: 'wazuh_agent' }
  tasks:
    - name: Add MSDefender and Sysmon collection rules to agent ossec.conf
      win_lineinfile:
        path: 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        line: "{{ item }}"
        insertafter: '<ossec_config>'
        state: present
      loop:
        - '  <!-- Microsoft Defender Logs -->'
        - '  <localfile>'
        - '    <location>Microsoft-Windows-Windows Defender/Operational</location>'
        - '    <log_format>eventchannel</log_format>'
        - '  </localfile>'
        - '  <!-- Sysmon Logs -->'
        - '  <localfile>'
        - '    <location>Microsoft-Windows-Sysmon/Operational</location>'
        - '    <log_format>eventchannel</log_format>'
        - '  </localfile>'

    - name: Restart Wazuh Agent service to apply configuration changes
      win_service:
        name: WazuhSvc
        state: restarted

  vars:
    wazuh_manager_host: "{{ hostvars['wazuh']['ansible_host'] }}"

- name: Install Wazuh Agent
  hosts: wazuh_agents_linux
  become: yes
  roles:
    - { role: 'wazuh_agent_linux', tags: 'wazuh_agent_linux' }
  vars:
    wazuh_manager_host: "{{ hostvars['wazuh']['ansible_host'] }}"
