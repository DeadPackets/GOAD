---
- name: "Get Wazuh API Credentials"
  hosts: wazuh
  become: yes
  tasks:
      - name: Extract wazuh-install-files.tar
        ansible.builtin.unarchive:
          src: /opt/wazuh/wazuh-install-files.tar
          dest: /opt/wazuh/
          remote_src: yes
          creates: /opt/wazuh/wazuh-install-files/wazuh-passwords.txt

      - name: Extract Wazuh API credentials using bash
        shell: |
          # Extract wazuh API username and password
          wazuh_user=$(grep -A 1 "# Password for wazuh API user" /opt/wazuh/wazuh-install-files/wazuh-passwords.txt | grep "api_username:" | awk -F"'" '{print $2}')
          wazuh_pass=$(grep -A 2 "# Password for wazuh API user" /opt/wazuh/wazuh-install-files/wazuh-passwords.txt | grep "api_password:" | awk -F"'" '{print $2}')
          
          echo "$wazuh_user"
          echo "$wazuh_pass"
        register: wazuh_api_creds

      - name: Set Wazuh API credentials as facts
        ansible.builtin.set_fact:
          wazuh_api_user: "{{ wazuh_api_creds.stdout_lines[0] }}"
          wazuh_api_password: "{{ wazuh_api_creds.stdout_lines[1] }}"

      - name: "Display Wazuh API credentials for debugging"
        debug:
          msg: "Wazuh API User: {{ wazuh_api_user }}, Wazuh API Password: {{ wazuh_api_password }}"

# Ansible playbook for attackbox provisioning
- name: "Setup LLM-AD-Defense Server"
  hosts: llmdefense
  become: yes
  tasks:
    - name: "Enable SSH service"
      systemd:
        name: ssh
        enabled: yes
        state: started

    - name: "Configure SSH to allow password authentication"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
      notify: restart ssh

    - name: "Set ubuntu user password"
      user:
        name: ubuntu
        password: "{{ 'ubuntu' | password_hash('sha512') }}"
        state: present

    - name: "Add ubuntu user to sudo group"
      user:
        name: ubuntu
        groups: sudo
        append: yes

    - name: "Install docker with easy_install script"
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: "Add ubuntu user to docker group"
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: "Copy LLM-AD-Defense files"
      copy:
        src: ./files/LLM-AD-Defense
        dest: /home/ubuntu
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        remote_src: no
        force: yes

    - name: "Write .env file for LLM-AD-Defense"
      copy:
        dest: /home/ubuntu/LLM-AD-Defense/.env
        content: |
          WAZUH_USER={{ hostvars['wazuh']['wazuh_api_user'] }}
          WAZUH_PASS={{ hostvars['wazuh']['wazuh_api_password'] }}
          OPENROUTER_API_KEY={{ 'c2stb3ItdjEtZDg4NGRhYjU5OWY1MTU1MzRjYmUyZWZjMGU0ZWYzNDRjMmQ4NmI5YzA2NTE3OWYyMjYzZDVlYTg4OWRhYmU2Yg==' | ansible.builtin.b64decode }}

    - name: "Build and run LLM-AD-Defense Docker container"
      shell: |
        cd /home/ubuntu/LLM-AD-Defense
        docker compose up --build -d

  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted

- name: "Setup custom-integration in ossec.conf of Wazuh Manager"
  hosts: wazuh
  become: yes
  tasks:
    - name: "Backup original ossec.conf"
      copy:
        src: /var/ossec/etc/ossec.conf
        dest: /var/ossec/etc/ossec.conf.backup
        remote_src: yes

    - name: "Add custom integration to ossec.conf"
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK - LLM AD Defense Integration -->"
        insertbefore: "</ossec_config>"
        block: |
          <integration>
            <name>custom-llm-ad-defense</name>
            <hook_url>http://192.168.56.200:8080/receive-alert</hook_url>
            <level>10</level>
            <alert_format>json</alert_format>
          </integration>

    - name: "Copy custom integration ./files/custom-llm-ad-defense"
      copy:
        src: ./files/custom-llm-ad-defense
        dest: /var/ossec/integrations/custom-llm-ad-defense
        owner: root
        group: wazuh
        mode: '0750'
        remote_src: no
        force: yes

    - name: "Copy custom integration ./files/custom-llm-ad-defense.py"
      copy:
        src: ./files/custom-llm-ad-defense.py
        dest: /var/ossec/integrations/custom-llm-ad-defense.py
        owner: root
        group: wazuh
        mode: '0750'
        remote_src: no
        force: yes

    - name: "Restart Wazuh manager service"
      systemd:
        name: wazuh-manager
        state: restarted
        enabled: yes

    - name: "Wait for Wazuh manager to be fully started"
      wait_for:
        port: 1514
        host: localhost
        delay: 5
        timeout: 60

    - name: "Check Wazuh manager service status"
      systemd:
        name: wazuh-manager
      register: wazuh_status

    - name: "Verify Wazuh manager is running"
      fail:
        msg: "Wazuh manager service is not running properly"
      when: wazuh_status.status.ActiveState != "active"

    - name: "Check integration configuration in logs"
      shell: tail -n 50 /var/ossec/logs/ossec.log | grep -i "integration\|webhook" || echo "No integration messages found yet"
      register: integration_logs

    - name: "Display integration status"
      debug:
        msg: "Integration logs: {{ integration_logs.stdout }}"
