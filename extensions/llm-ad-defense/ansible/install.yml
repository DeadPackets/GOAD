---
# Ansible playbook for attackbox provisioning
- name: "Setup LLM-AD-Defense Server"
  hosts: llmdefense
  become: yes
  tasks:
    - name: "Enable SSH service"
      systemd:
        name: ssh
        enabled: yes
        state: started

    - name: "Configure SSH to allow password authentication"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
      notify: restart ssh

    - name: "Set ubuntu user password"
      user:
        name: ubuntu
        password: "{{ 'ubuntu' | password_hash('sha512') }}"
        state: present

    - name: "Add ubuntu user to sudo group"
      user:
        name: ubuntu
        groups: sudo
        append: yes

    - name: "Install docker with easy_install script"
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: "Add ubuntu user to docker group"
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: "Copy LLM-AD-Defense files"
      copy:
        src: ./files/LLM-AD-Defense
        dest: /home/ubuntu
        owner: ubuntu
        group: ubuntu
        mode: '0755'
        remote_src: no
        force: yes

    - name: "Build and run LLM-AD-Defense Docker container"
      shell: |
        cd /home/ubuntu/LLM-AD-Defense
        docker compose up --build -d

  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted
- name: "Setup custom-integration in ossec.conf of Wazuh Manager"
  hosts: wazuh
  become: yes
  tasks:
    - name: "Backup original ossec.conf"
      copy:
        src: /var/ossec/etc/ossec.conf
        dest: /var/ossec/etc/ossec.conf.backup
        remote_src: yes

    - name: "Add custom integration to ossec.conf"
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK - LLM AD Defense Integration -->"
        insertbefore: "</ossec_config>"
        block: |
          <integration>
            <name>custom-llm-ad-defense</name>
            <hook_url>http://192.168.56.200:8080/receive-alert</hook_url>
            <level>10</level>
            <alert_format>json</alert_format>
          </integration>

    - name: "Copy custom integration ./files/custom-llm-ad-defense"
      copy:
        src: ./files/custom-llm-ad-defense
        dest: /var/ossec/integrations/custom-llm-ad-defense
        owner: root
        group: wazuh
        mode: '0750'
        remote_src: no
        force: yes

    - name: "Copy custom integration ./files/custom-llm-ad-defense.py"
      copy:
        src: ./files/custom-llm-ad-defense.py
        dest: /var/ossec/integrations/custom-llm-ad-defense.py
        owner: root
        group: wazuh
        mode: '0750'
        remote_src: no
        force: yes

    - name: "Restart Wazuh manager service"
      systemd:
        name: wazuh-manager
        state: restarted
        enabled: yes

    - name: "Wait for Wazuh manager to be fully started"
      wait_for:
        port: 1514
        host: localhost
        delay: 5
        timeout: 60

    - name: "Check Wazuh manager service status"
      systemd:
        name: wazuh-manager
      register: wazuh_status

    - name: "Verify Wazuh manager is running"
      fail:
        msg: "Wazuh manager service is not running properly"
      when: wazuh_status.status.ActiveState != "active"

    - name: "Check integration configuration in logs"
      shell: tail -n 50 /var/ossec/logs/ossec.log | grep -i "integration\|webhook" || echo "No integration messages found yet"
      register: integration_logs

    - name: "Display integration status"
      debug:
        msg: "Integration logs: {{ integration_logs.stdout }}"
